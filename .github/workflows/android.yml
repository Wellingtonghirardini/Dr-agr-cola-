name: Gerar APK Dr. Agrícola

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar projeto Android
        run: |
          set -e

          rm -rf projeto
          mkdir -p projeto

          echo "Descompactando projeto..."
          unzip -q Dr_Agricola_V6_Android.zip -d projeto

          echo "Conteúdo do projeto:"
          find projeto -maxdepth 7 -type f | sort

          ROOT="projeto"

          echo "Projeto Android:"
          echo "$ROOT"

          # Corrigir nomes de arquivos/pastas
          if [ -d "$ROOT/App" ]; then
            mv "$ROOT/App" "$ROOT/app"
          fi

          if [ -f "$ROOT/Build.gradle" ]; then
            mv "$ROOT/Build.gradle" "$ROOT/build.gradle"
          fi

          if [ -f "$ROOT/Settings" ]; then
            mv "$ROOT/Settings" "$ROOT/settings.gradle"
          fi

          if [ -d "$ROOT/app/src/main/Java" ]; then
            mv "$ROOT/app/src/main/Java" "$ROOT/app/src/main/java"
          fi

          if [ -d "$ROOT/app/src/main/Res" ]; then
            mv "$ROOT/app/src/main/Res" "$ROOT/app/src/main/res"
          fi

          if [ -d "$ROOT/app/src/main/Assets" ]; then
            mv "$ROOT/app/src/main/Assets" "$ROOT/app/src/main/assets"
          fi

          if [ -d "$ROOT/app/src/main/java/com/dragricola/App" ]; then
            mv "$ROOT/app/src/main/java/com/dragricola/App" "$ROOT/app/src/main/java/com/dragricola/app"
          fi

          # AndroidX
          echo "android.useAndroidX=true" > "$ROOT/gradle.properties"
          echo "android.enableJetifier=true" >> "$ROOT/gradle.properties"

          # Garantir pastas necessárias
          mkdir -p "$ROOT/app/src/main/assets"
          mkdir -p "$ROOT/app/src/main/res/values"

          # Copiar o HTML atualizado
          echo "Copiando index.html atualizado..."
          cp index.html "$ROOT/app/src/main/assets/index.html"

          # CORREÇÃO DO TEMA
          echo "Corrigindo Theme.DrAgricola..."

          cat > "$ROOT/app/src/main/res/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="Theme.DrAgricola" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#08783D</item>
                  <item name="android:statusBarColor">#08783D</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF

          echo "Tema corrigido."

          echo "Verificando arquivos importantes:"
          ls -la "$ROOT"
          ls -la "$ROOT/app"
          ls -la "$ROOT/app/src/main"
          ls -la "$ROOT/app/src/main/res/values"

          echo "Verificando HTML:"
          wc -l "$ROOT/app/src/main/assets/index.html"

          echo "Verificando build.gradle:"
          cat "$ROOT/build.gradle"

          echo "Verificando settings.gradle:"
          cat "$ROOT/settings.gradle"

          echo "Verificando tema:"
          cat "$ROOT/app/src/main/res/values/themes.xml"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verificar Gradle
        working-directory: ${{ github.workspace }}/projeto
        run: |
          gradle --version

      - name: Gerar APK
        working-directory: ${{ github.workspace }}/projeto
        run: |
          gradle clean
          gradle assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          echo "Procurando APK..."
          find projeto/app/build/outputs -type f -name "*.apk" -print

          if [ ! -f "projeto/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado com sucesso."

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Agricola-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
