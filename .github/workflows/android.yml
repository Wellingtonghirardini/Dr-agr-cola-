name: Gerar APK Dr. Agrícola

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar projeto Android
        run: |
          set -e

          rm -rf projeto
          mkdir -p projeto

          echo "Descompactando projeto Android..."
          unzip -q Dr_Agricola_V6_Android.zip -d projeto

          echo ""
          echo "Conteúdo do ZIP:"
          find projeto -maxdepth 8 -type f | sort

          echo ""
          echo "Procurando settings.gradle..."

          SETTINGS=$(find projeto -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não foi encontrado."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo ""
          echo "Pasta do projeto encontrada:"
          echo "$ROOT"

          if [ -d "$ROOT/App" ]; then
            mv "$ROOT/App" "$ROOT/app"
          fi

          if [ -f "$ROOT/Build.gradle" ]; then
            mv "$ROOT/Build.gradle" "$ROOT/build.gradle"
          fi

          if [ -f "$ROOT/Settings" ]; then
            mv "$ROOT/Settings" "$ROOT/settings.gradle"
          fi

          if [ -d "$ROOT/app/src/main/Java" ]; then
            mv "$ROOT/app/src/main/Java" "$ROOT/app/src/main/java"
          fi

          if [ -d "$ROOT/app/src/main/Res" ]; then
            mv "$ROOT/app/src/main/Res" "$ROOT/app/src/main/res"
          fi

          if [ -d "$ROOT/app/src/main/Assets" ]; then
            mv "$ROOT/app/src/main/Assets" "$ROOT/app/src/main/assets"
          fi

          if [ -d "$ROOT/app/src/main/java/com/dragricola/App" ]; then
            mv "$ROOT/app/src/main/java/com/dragricola/App" \
               "$ROOT/app/src/main/java/com/dragricola/app"
          fi

          echo "android.useAndroidX=true" > "$ROOT/gradle.properties"
          echo "android.enableJetifier=true" >> "$ROOT/gradle.properties"

          mkdir -p "$ROOT/app/src/main/assets"

          echo ""
          echo "Copiando index.html correto para o APK..."

          cp index.html "$ROOT/app/src/main/assets/index.html"

          echo ""
          echo "Verificando index.html usado no APK:"
          wc -l "$ROOT/app/src/main/assets/index.html"

          echo ""
          echo "Primeiras linhas:"
          head -n 10 "$ROOT/app/src/main/assets/index.html"

          echo ""
          echo "Salvando caminho do projeto..."
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: |
          set -e

          echo "Pasta do projeto:"
          echo "$ROOT"

          echo ""
          echo "Conteúdo da pasta:"
          ls -la "$ROOT"

          echo ""
          echo "Executando Gradle..."

          cd "$ROOT"

          gradle assembleDebug

      - name: Verificar APK
        run: |
          echo "Procurando APK..."

          find "$ROOT/app/build/outputs" -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Agricola-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
