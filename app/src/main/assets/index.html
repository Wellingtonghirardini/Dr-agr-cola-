<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dr. Agrícola</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f3;font-family:Arial,sans-serif;color:#1e2923}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f7faf8;padding-bottom:82px}
header{background:#087a3e;color:white;padding:18px 18px 14px;display:flex;align-items:center;gap:12px}
header img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #9ff2bc}
header b{font-size:20px}header small{display:block;opacity:.85;margin-top:3px}
main{padding:16px}.hero{background:white;border-radius:22px;padding:18px;border:1px solid #dce8e1}
.hero img{width:100%;border-radius:18px;display:block}.hero h1{margin:14px 0 6px}.hero p{color:#66736c}
button{border:0;border-radius:14px;padding:12px 15px;font-weight:700;background:#087a3e;color:#fff}
.card{background:white;border:1px solid #dce8e1;border-radius:18px;padding:16px;margin-top:12px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:white;border-top:1px solid #dce8e1;display:flex;padding:8px}
.nav button{flex:1;background:transparent;color:#52615a;font-size:12px}.nav button.active{color:#087a3e}
.chat{display:none}.messages{min-height:55vh}.msg{display:flex;gap:8px;margin:12px 0}.msg img{width:38px;height:38px;border-radius:50%;object-fit:cover}.bubble{padding:12px 14px;border-radius:16px;max-width:82%;line-height:1.4}.bot{background:#fff;border:1px solid #dce8e1}.me{margin-left:auto;background:#087a3e;color:white}
.composer{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);width:min(488px,94%);display:none;gap:6px;background:white;padding:8px;border:1px solid #dce8e1;border-radius:17px}.composer input{flex:1;border:0;outline:0;padding:8px;font-size:15px}.composer button{padding:10px}
</style>
</head>
<body>
<div class="app">
<header><img src="assistente_branco_billy.png"><div><b>Dr. Agrícola</b><small>Seu assistente de máquinas agrícolas</small></div></header>
<main id="home">
<div class="hero">
<img src="assistente_branco_billy.png">
<h1>Olá! Eu sou o Dr. Agrícola.</h1>
<p>Seu assistente técnico para máquinas agrícolas.</p>
<button onclick="openChat()">💬 Conversar com o Dr. Agrícola</button>
</div>
<div class="card"><b>👤 Seu perfil</b><p id="profileText">Cadastre seu nome e suas máquinas para personalizar o atendimento.</p><button onclick="profile()">Meu perfil</button></div>
</main>
<main id="chat" class="chat">
<div id="messages" class="messages"></div>
</main>
<div id="composer" class="composer">
<input id="input" placeholder="Digite sua pergunta..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
<nav class="nav"><button class="active" onclick="home()">🏠<br>Início</button><button onclick="openChat()">🤖<br>Chat</button><button onclick="profile()">👤<br>Perfil</button></nav>
</div>
<script>
const img='assistente_branco_billy.png';
function p(){try{return JSON.parse(localStorage.getItem('dr_profile')||'{}')}catch(e){return{}}}
function home(){document.getElementById('home').style.display='block';document.getElementById('chat').style.display='none';document.getElementById('composer').style.display='none'}
function openChat(){document.getElementById('home').style.display='none';document.getElementById('chat').style.display='block';document.getElementById('composer').style.display='flex';if(!document.getElementById('messages').children.length)welcome()}
const SERVER='https://dr-agr-cola-1.onrender.com';
const history=[];let sending=false;
function welcome(){let x=p();addBot((x.name?'Olá, '+x.name+'! ':'Olá! ')+'Sou o Dr. Agrícola. Me diga a marca, o modelo e o problema da sua máquina.');}
function message(text,user=false){const row=document.createElement('div');row.className='msg';if(!user){const avatar=document.createElement('img');avatar.src=img;row.appendChild(avatar);}const bubble=document.createElement('div');bubble.className='bubble '+(user?'me':'bot');bubble.style.whiteSpace='pre-wrap';bubble.textContent=text;row.appendChild(bubble);document.getElementById('messages').appendChild(row);row.scrollIntoView({block:'end',behavior:'smooth'});return row;}
function addBot(t){return message(t);}
async function send(){
 const i=document.getElementById('input'),text=i.value.trim();if(!text||sending)return;
 if(text.length>6000){addBot('Envie uma mensagem com até 6.000 caracteres.');return;}
 sending=true;i.value='';message(text,true);const button=document.querySelector('#composer button');button.disabled=true;
 const pending=addBot('Consultando o Dr. Agrícola...');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),120000);
 try{
  const response=await fetch(SERVER+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-12)}),signal:controller.signal});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'O servidor não conseguiu responder.');
  const answer=data.resposta||data.answer;if(typeof answer!=='string'||!answer.trim())throw new Error('O servidor retornou uma resposta vazia.');
  pending.remove();addBot(answer);history.push({role:'user',content:text},{role:'assistant',content:answer});
 }catch(error){pending.remove();addBot(error.name==='AbortError'?'O servidor demorou para responder. Tente novamente.':error.message==='Failed to fetch'?'Não consegui conectar ao servidor. Confira sua internet e tente novamente.':error.message);i.value=text;}
 finally{clearTimeout(timer);sending=false;button.disabled=false;i.focus();}
}
function profile(){let x=p(),name=prompt('Seu nome:',x.name||'');if(name!==null){x.name=name;localStorage.setItem('dr_profile',JSON.stringify(x));document.getElementById('profileText').textContent=name?'Olá, '+name+'! Seu perfil está salvo neste aparelho.':'Perfil ainda não preenchido.'}}
</script>
</body>
</html>
